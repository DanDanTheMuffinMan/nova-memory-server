name: API security regression
on:
  pull_request:
    paths:
      - 'api-security.js'
      - 'index.js'
      - 'test/api-security.test.js'
      - 'package.json'
      - '.github/workflows/api-security.yml'
  push:
    branches: [main]
    paths:
      - 'api-security.js'
      - 'index.js'
      - 'test/api-security.test.js'
      - 'package.json'
      - '.github/workflows/api-security.yml'
permissions:
  contents: read
jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check without starting the server
        run: |
          node --check index.js
          node --check api-security.js
      - name: Run REST and Socket.IO authentication tests
        run: node --test test/api-security.test.js
